<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARIBU TOUR & TRAVEL — Login</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#10243e,#1b8a8f);min-height:100vh;display:grid;place-items:center}.box{width:min(420px,90%);background:#fff;padding:32px;border-radius:18px}h1{color:#10243e}label{display:block;margin-top:16px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #d7dee7;border-radius:8px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:#1b8a8f;color:#fff;font-weight:bold}.error{color:#c0392b}</style></head><body><div class="box"><h1>✈ KARIBU TOUR & TRAVEL</h1><p>Travel & Hospitality ERP</p><form method="post"><label>Username</label><input name="username" required><label>Password</label><input name="password" type="password" required><button>Sign in</button></form>{% with messages=get_flashed_messages() %}{% for m in messages %}<p class="error">{{m}}</p>{% endfor %}{% endwith %}</div></body></html>
